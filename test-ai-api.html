<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AI API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        .loading {
            color: blue;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Test de API de IA - EasyBraille</h1>
    
    <div>
        <h2>1. Test de conexión básica</h2>
        <button onclick="testConnection()">Probar conexión a Render</button>
    </div>

    <div>
        <h2>2. Test de predicción con imagen</h2>
        <input type="file" id="imageFile" accept="image/*">
        <button onclick="testPredict()">Enviar imagen a /predict</button>
    </div>

    <div id="result"></div>

    <script>
        const API_URL = 'https://easybraille-api.onrender.com';
        const resultDiv = document.getElementById('result');

        async function testConnection() {
            resultDiv.innerHTML = '<span class="loading">Probando conexión...</span>';
            
            try {
                const startTime = Date.now();
                const response = await fetch(API_URL, {
                    method: 'GET',
                    mode: 'cors'
                });
                const endTime = Date.now();
                
                const text = await response.text();
                
                resultDiv.innerHTML = `
<span class="success">✓ Conexión exitosa!</span>
Status: ${response.status}
Tiempo: ${endTime - startTime}ms
Respuesta: ${text}
                `;
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }

        async function testPredict() {
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Por favor selecciona una imagen');
                return;
            }

            resultDiv.innerHTML = '<span class="loading">Enviando imagen... esto puede tardar 30-60 segundos...</span>';
            
            try {
                const formData = new FormData();
                formData.append('image', file);
                
                const startTime = Date.now();
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });
                const endTime = Date.now();
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
<span class="success">✓ Predicción completada!</span>
Status: ${response.status}
Tiempo: ${endTime - startTime}ms (${((endTime - startTime) / 1000).toFixed(2)}s)
Respuesta:
${JSON.stringify(data, null, 2)}
                `;
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
