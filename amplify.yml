version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing dependencies..."
        - npm ci
    build:
      commands:
        - echo "Building Next.js application..."
        - echo "Using default backend URL for production"
        - export NEXT_PUBLIC_API_URL="https://easybraille-backend.onrender.com"
        - export NEXTAUTH_URL="$AWS_APP_ID.amplifyapp.com"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*